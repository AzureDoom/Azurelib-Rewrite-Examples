plugins {
    id 'idea'
    id 'net.fabricmc.fabric-loom-remap' version '1.18.4'
    id 'ploceus' version '1.18.1'
    id 'com.diffplug.spotless' version "8.8.0"
}

base {
    archivesName = "${mod_id}-ornithe-${minecraft_version}"
}

version = mod_version
group = maven_group

ploceus {
    setIntermediaryGeneration(2)
}

repositories {
    mavenLocal()
    maven {
        name = 'AzureDoom Mods'
        url = 'https://maven.azuredoom.com/mods'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"

    clientExceptions ploceus.raven(project.client_raven_build, 'client')
    serverExceptions ploceus.raven(project.server_raven_build, 'server')
    clientSignatures ploceus.sparrow(project.client_sparrow_build, 'client')
    serverSignatures ploceus.sparrow(project.server_sparrow_build, 'server')
    clientNests ploceus.nests(project.client_nests_build, 'client')
    serverNests ploceus.nests(project.server_nests_build, 'server')
    mappings ploceus.featherMappings(project.feather_build)

    ploceus.dependOsl(project.osl_version)

    // Published from the AzureLib b1.7.3 Ornithe project (`./gradlew publishToMavenLocal` there while developing).
    modImplementation "mod.azure.azurelib:azurelib-ornithe-${minecraft_version}:${azurelib_version}"
    modLocalRuntime "maven.modrinth:wIWtkL0s:MwJWQ1yw"
    modLocalRuntime "maven.modrinth:LIGlLgiL:waXfar2S"

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 8
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

spotless {
    java {
        eclipse().configFile("$rootDir/eclipse-formatter.xml")
        endWithNewline()
        importOrder("", "java", group.toString(), "\\#")
        leadingTabsToSpaces(4)
        removeUnusedImports()
        trimTrailingWhitespace()
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn("spotlessApply")
}
