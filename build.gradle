buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
    }
    dependencies {
        classpath 'com.anatawa12.forge:ForgeGradle:1.2-1.1.1'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    // Spotless 5.17.x is the last line that runs on a Java 8 Gradle JVM (6.x needs Java 11+).
    id 'com.diffplug.spotless' version '5.17.1'
}

apply plugin: 'forge'

version = mod_version
group = mod_group_id
archivesBaseName = "${mod_id}-forge-${mc_version}"

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

minecraft {
    version = "${mc_version}-${forge_version}"
    runDir = 'run'
    mappings = "${mappings_channel}_${mappings_version}"

    if (file('src/main/resources/META-INF/accesstransformer.cfg').exists()) {
        accessTransformer file('src/main/resources/META-INF/accesstransformer.cfg')
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://jitpack.io' }
    maven {
        name = 'AzureDoom'
        url = 'https://maven.azuredoom.com/mods'
        content { includeGroup 'mod.azure.azurelib' }
    }

    maven {
        name = 'Cursemaven'
        url = 'https://www.cursemaven.com/'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    // @Nullable / @Nonnull; annotations only, nothing needed at runtime.
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    // AzureLib's deobfuscated "dev" jar for the dev environment. Players install the normal AzureLib jar (and UniMixins).
    implementation("mod.azure.azurelib:azurelib-forge-${mc_version}:${azurelib_version}:dev") {
        transitive = false
    }

    implementation(
            "com.github.LegacyModdingMC.UniMixins:unimixins-all-1.7.10:${unimixins_version}:dev"
    ) {
        transitive = false
    }

    annotationProcessor(
            "com.github.LegacyModdingMC.UniMixins:unimixins-all-1.7.10:${unimixins_version}:dev"
    ) {
        transitive = false
    }
}

def mixinSrg = file("${buildDir}/tmp/compileJava/${mod_id}.mixins.srg")
def mixinRefmap = file("${buildDir}/tmp/compileJava/${mod_id}.refmap.json")

spotless {
    java {
        // Pinned: newer Eclipse JDT formatter versions need Java 11+ to run.
        eclipse('4.13.0').configFile("$rootDir/eclipse-formatter.xml")
        endWithNewline()
        importOrder('', 'java', 'mod.azure.azurelib', 'mod.azure.azexamples', '\\#')
        indentWithSpaces(4)
        removeUnusedImports()
        trimTrailingWhitespace()
    }
}

compileJava {
    dependsOn 'genSrgs'
    dependsOn 'spotlessApply'

    outputs.file mixinSrg
    outputs.file mixinRefmap

    doFirst {
        mixinSrg.parentFile.mkdirs()
        mixinSrg.text = ''

        options.compilerArgs += [
                "-AreobfSrgFile=${tasks.reobf.srg}",
                "-AoutSrgFile=${mixinSrg}",
                "-AoutRefMapFile=${mixinRefmap}",
                '-AdefaultObfuscationEnv=searge'
        ]
    }
}

reobf {
    addExtraSrgFile mixinSrg
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

processResources {
    def replaceProperties = [
            mc_version: mc_version,
            forge_version: forge_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            pack_format_number: pack_format_number,
            version: project.version,
            mcversion: mc_version
    ]

    inputs.properties replaceProperties

    filesMatching(['mcmod.info', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    filesMatching('META-INF/accesstransformer.cfg') {
        name = "${mod_id}_at.cfg"
    }
}

jar {
    dependsOn compileJava

    from mixinRefmap
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
                'FMLCorePlugin': 'mod.azure.azexamples.coremod.AzExamplesLoadingPlugin',
                'FMLCorePluginContainsFMLMod': 'true',
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': mod_authors
        )
    }
}

tasks.matching {
    it.name == 'runClient' || it.name == 'runServer'
}.all {
    args '--tweakClass', 'org.spongepowered.asm.launch.MixinTweaker'
    // Mod jars on the dev classpath aren't scanned for mixin configs, so load AzureLib's and ours explicitly.
    args '--mixin', 'azurelib.mixins.json', '--mixin', "${mod_id}.mixins.json"

    systemProperty 'mixin.env.remapRefMap', 'true'

    doFirst {
        systemProperty(
                'mixin.env.refMapRemappingFile',
                tasks.genSrgs.srgToMcp.absolutePath
        )
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
