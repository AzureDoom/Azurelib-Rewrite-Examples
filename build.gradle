plugins {
    id 'idea'
    id 'fabric-loom' version '1.17.20'
    id 'babric-loom-extension' version '1.17.4'
    id 'com.diffplug.spotless' version "8.8.0"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

base {
    archivesName = "${mod_id}-stationapi-${minecraft_version}"
}

version = mod_version
group = maven_group

repositories {
    mavenLocal()
    maven { url = 'https://maven.glass-launcher.net/snapshots/' }
    maven { url = 'https://maven.glass-launcher.net/releases/' }
    maven { url = 'https://maven.glass-launcher.net/babric' }
    maven { url = 'https://maven.azuredoom.com/mods' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://jitpack.io/' }
    maven { url = 'https://libraries.minecraft.net/' }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.glasslauncher:biny:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"

    modImplementation "net.modificationstation:StationAPI:${stationapi_version}"
    modImplementation "mod.azure.azurelib:azurelib-stationapi-${minecraft_version}:${azurelib_version}"
    modLocalRuntime "net.glasslauncher.mods:AlwaysMoreItems:${alwaysmoreitems_version}"
    modLocalRuntime "maven.modrinth:MTea0HEh:reBNQY2O"
    modLocalRuntime "maven.modrinth:ros9lAuk:tk9tDFz1"
    modLocalRuntime "maven.modrinth:zq6BznqT:H4DNrOdq"
    modLocalRuntime "maven.modrinth:rFeWTq4G:JkTIrrTV"
    modLocalRuntime "maven.modrinth:NhFO9av6:kpncS0z4"
    modImplementation "maven.modrinth:wIWtkL0s:6THYblPw"

    implementation 'org.apache.logging.log4j:log4j-core:2.17.2'
    implementation 'org.slf4j:slf4j-api:1.8.0-beta4'
    implementation 'org.apache.logging.log4j:log4j-slf4j18-impl:2.17.1'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

configurations.configureEach {
    exclude group: 'babric'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

spotless {
    java {
        eclipse().configFile("$rootDir/eclipse-formatter.xml")
        endWithNewline()
        importOrder("", "java", group.toString(), "\\#")
        leadingTabsToSpaces(4)
        removeUnusedImports()
        trimTrailingWhitespace()
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn("spotlessApply")
}