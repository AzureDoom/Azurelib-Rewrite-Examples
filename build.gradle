plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'com.diffplug.spotless' version "6.13.0"
}

version = mod_version
group = mod_group_id

base {
    archivesName = "AzureLibExamples-Forge-${mc_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

println "Java: ${System.getProperty('java.version')}, JVM: ${System.getProperty('java.vm.version')} (${System.getProperty('java.vendor')}), Arch: ${System.getProperty('os.arch')}"

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

minecraft {
    mappings channel: mappings_channel, version: mappings_version

    runs {
        configureEach {
            workingDirectory project.file("run/${it.name}")

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            arg '-torg.spongepowered.asm.launch.MixinTweaker'
            args '--mixin', 'azurelib.mixins.json', '--mixin', "${mod_id}.mixins.json"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}
        server {}
    }
}

def copyResourcesToClasses = tasks.register('copyResourcesToClasses', Copy) {
    dependsOn tasks.named('compileJava')
    from tasks.named('processResources')
    into sourceSets.main.java.destinationDirectory
}
tasks.named('classes') { dependsOn copyResourcesToClasses }

tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
    dependsOn tasks.named('classes')
    doFirst {
        def libsDir = layout.buildDirectory.dir('libs').get().asFile.toPath()
        classpath = sourceSets.main.output + classpath.filter { !it.toPath().startsWith(libsDir) }
    }
}

repositories {
    maven {
        name = 'AzureDoom'
        url = 'https://maven.azuredoom.com/mods'
        content { includeGroup 'mod.azure.azurelib' }
    }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"

    implementation fg.deobf("mod.azure.azurelib:azurelib-forge-${mc_version}:${azurelib_version}")

    implementation("org.spongepowered:mixin:${mixin_version}") {
        transitive = false
    }
    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"
}

processResources {
    Map replaceProperties = [
            mc_version        : mc_version,
            forge_version     : forge_version,
            mod_id            : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors       : mod_authors, mod_description: mod_description, pack_format_number: pack_format_number,
    ]
    inputs.properties replaceProperties

    filesMatching(['mcmod.info', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'ForceLoadAsMod'          : 'true',
                'TweakClass'              : 'org.spongepowered.asm.launch.MixinTweaker',
                'TweakOrder'              : '0',
                'MixinConfigs'            : "${mod_id}.mixins.json",
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

spotless {
    java {
        eclipse().configFile("$rootDir/eclipse-formatter.xml")
        endWithNewline()
        importOrder("", "java", "mod.azure.azurelib", group.toString(), "\\#")
        indentWithSpaces(4)
        removeUnusedImports()
        trimTrailingWhitespace()
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn("spotlessApply")
}
