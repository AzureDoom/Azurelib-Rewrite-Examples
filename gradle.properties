# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to the root build.gradle expandProps map.

# Gradle
org.gradle.daemon                    = false
org.gradle.jvmargs                   = -Xmx3G

# Plugins
parchment_minecraft                  = 1.20.1
parchment_version                    = 2023.09.03

# Common
java_version                         = 17
minecraft_version                    = 1.20.1

# NeoForge
loader_version_range                 = [47,)
mapping_channel                      = official
mapping_version                      = 1.20.1
minecraft_version_range              = [1.20.1, 1.20.2)
neo_version                          = 47.4.0
neo_version_range                    = [47,)

# Fabric
fabric_version                       = 0.83.0+1.20.1
fabric_loader_version                = 0.16.14

# Libs
modmenu_version                      = 7.2.2
azurelib_version                     = 3.0.26

# Mod options
group                                = mod.azure.azexamples
mod_name                             = AzureLib Examples
mod_author                           = AzureDoom, Boston
mod_id                               = azexamples
mod_license                          = MIT
mod_description                      = AzureLib Examples
mod_credits                          = AzureDoom, Boston
mod_logo                             = icon.png
mod_url                              = https://github.com/AzureDoom/Azurelib-Rewrite-Examples
mod_issues                           = https://github.com/AzureDoom/Azurelib-Rewrite-Examples/issues
mod_sources                          = https://github.com/AzureDoom/Azurelib-Rewrite-Examples
version                              = 1.0.0
